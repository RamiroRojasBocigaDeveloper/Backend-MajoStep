# Nombre de la aplicacion
spring.application.name=chancla-lite-auth

# PostgreSQL (local development)
spring.datasource.url=jdbc:postgresql://localhost:5432/chancla_lite_auth
spring.datasource.username=chancla_user
spring.datasource.password=chancla_password_123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=true
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# JWT (seguridad futura)
jwt.secret=***REMOVED***
jwt.expirationMillis=86400000

# CORS (Angular dev)
cors.allowed.origins=http://localhost:4200

# Tomcat
server.tomcat.threads.max=250
server.tomcat.threads.min-spare=10
