# Nombre de la aplicacion
spring.application.name=chancla-lite-auth

# MariaDB — usa variables de entorno en Docker, valores por defecto para local
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/chancla_lite_auth?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:M4r4v1ll4137.}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=true
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
jwt.secret=${JWT_SECRET:***REMOVED***}
jwt.expirationMillis=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed.origins=${CORS_ORIGINS:http://localhost:4200}

# Tomcat
server.tomcat.threads.max=250
server.tomcat.threads.min-spare=10
