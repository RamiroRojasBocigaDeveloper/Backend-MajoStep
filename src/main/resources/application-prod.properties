# Nombre de la aplicacion
spring.application.name=chancla-lite-auth

# MySQL - FreeSQLDatabase
spring.datasource.url=${DB_URL:jdbc:mariadb://wy514k.h.filess.io:61000/MajoStepDB_sharpmedig}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
# IMPORTANTE: evitar validaciones pesadas en arranque (Render timeout)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Necesario cuando use_jdbc_metadata_defaults=false — Hibernate no puede
# autodetectar el dialecto sin consultar metadatos JDBC
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# Permite que la app arranque aunque la BD no esté lista de inmediato
spring.jpa.defer-datasource-initialization=true

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expirationMillis=86400000

# CORS
cors.allowed.origins=${FRONTEND_URL}

# Tomcat - Limitar hilos para instancia gratuita de Render (512MB RAM)
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5

# Puerto - Render inyecta la variable PORT dinámicamente
server.port=${PORT:10000}

# Logging
logging.level.root=INFO
logging.level.com.chancla=INFO

# HikariCP - Limitar conexiones para Filess.io free tier (max 2 conexiones simultáneas)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000

# CLAVE para Render: no bloquear el arranque si la BD tarda en responder
spring.datasource.hikari.initializationFailTimeout=0

# Evita que Hibernate consulte metadatos JDBC al arrancar (acelera startup ~20s)
# Requiere especificar spring.jpa.database-platform explícitamente (ver arriba)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

spring.main.lazy-initialization=true

# Cloudinary (Las credenciales de entorno en Render las inyectarán)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}