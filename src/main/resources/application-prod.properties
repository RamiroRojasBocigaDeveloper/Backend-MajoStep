# Nombre de la aplicacion
spring.application.name=chancla-lite-auth

# MySQL - FreeSQLDatabase
spring.datasource.url=${DB_URL:jdbc:mariadb://wy514k.h.filess.io:61000/MajoStepDB_sharpmedig}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
# IMPORTANTE: evitar validaciones pesadas en arranque (Render timeout)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# No es necesario, Hibernate lo detecta solo (evita warning)
# spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expirationMillis=86400000

# CORS
cors.allowed.origins=${FRONTEND_URL}

# Tomcat
server.tomcat.threads.max=250
server.tomcat.threads.min-spare=10

# Puerto (Render usa variable PORT dinámica)
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.com.chancla=INFO

# Limitar conexiones para Filess.io free tier (max 5)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000

# CLAVE para Render: no bloquear arranque por la BD
spring.datasource.hikari.initializationFailTimeout=0

# Carga perezosa para acelerar startup
spring.main.lazy-initialization=true