# Nombre de la aplicación
spring.application.name=chancla-lite-auth

# MariaDB/Docker - Usando las credenciales de tu contenedor
spring.datasource.url=jdbc:mariadb://localhost:3308/chancla_lite_uth?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=chancla_user
spring.datasource.password=chancla_password_123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
jwt.secret=***REMOVED***
jwt.expirationMillis=86400000

# CORS (Angular dev)
cors.allowed-origins=http://localhost:4200

# Tomcat
server.tomcat.threads.max=250
server.tomcat.threads.min-spare=10

