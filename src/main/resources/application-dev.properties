# Nombre de la aplicacion
spring.application.name=chancla-lite-auth

# MariaDB/Docker puerto 3307 local
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/chancla_lite_auth?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Limites de subida de archivos (imagenes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=true
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# JWT (el valor real se toma de .env o de la variable de entorno JWT_SECRET)
jwt.secret=${JWT_SECRET}
jwt.expirationMillis=86400000

# CORS (Angular dev)
cors.allowed.origins=http://localhost:4200

# Tomcat
server.tomcat.threads.max=250
server.tomcat.threads.min-spare=10

# Cloudinary (el valor real se toma de .env o de variables de entorno)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}