# ===========================================
# PERFIL DOCKER - Los valores reales llegan por variables de entorno
# (docker-compose.yml inyecta DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, CORS_ORIGINS)
# Activar con SPRING_PROFILES_ACTIVE=docker
# ===========================================
spring.application.name=chancla-lite-auth

# MariaDB/Docker
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
jwt.secret=${JWT_SECRET}
jwt.expirationMillis=86400000

# CORS (Angular dev)
cors.allowed.origins=${CORS_ORIGINS:http://localhost:4200}

# Tomcat
server.tomcat.threads.max=250
server.tomcat.threads.min-spare=10

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
